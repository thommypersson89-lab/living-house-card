# Typecheck, build, check that dist/ is committed and up to date, and run the Playwright tests.
# Run it by hand with "update screenshots" to get new reference images as an artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: 'Rewrite the reference screenshots (uploaded as an artifact)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: dist/ is committed and up to date
        run: git diff --exit-code -- dist/ || { echo "Run 'npm run build' and commit dist/living-house-card.js"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test ${{ inputs.update_screenshots && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.update_screenshots
        with:
          name: screenshots
          path: tests/__screenshots__/
          retention-days: 14
