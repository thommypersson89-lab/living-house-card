# Makes a GitHub release with living-house-card.js attached (HACS installs from releases).
# Either push a tag like v0.2.0, or run this workflow by hand: it then tags the current main
# with the version in package.json.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Work out the tag
        id: tag
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$v" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match package.json ($v)"; exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/living-house-card.js
          generate_release_notes: true
